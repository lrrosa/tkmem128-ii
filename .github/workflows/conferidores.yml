# Roda as verificacoes de regressao do projeto a cada push e pull request.
#
# Dois jobs em paralelo, porque tem custos muito diferentes:
#
#   rapidos     -- cinco conferidores em Python puro, ~15 s no total;
#   alinhamento -- precisa do pcbnew, entao roda dentro da imagem oficial do
#                  KiCad. Puxar a imagem domina o tempo.
#
# O `alinhamento` so se tornou possivel quando os caminhos absolutos sairam do
# netlist.py e do netlist_exp.py: dentro do container eles resolviam para
# "F:/downloads/...", que e o disco da maquina de origem.

name: conferidores

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Chamado tambem pelo release.yml, para que uma tag so vire pacote publicado
  # depois que as seis verificacoes passam.
  workflow_call:

jobs:
  rapidos:
    runs-on: ubuntu-latest
    env:
      # Os conferidores imprimem acentos; sem isto um locale sem UTF-8
      # derrubaria o job no print, nao no que ele confere.
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Links e ancoras entre os documentos
        run: python tools/confere_links.py

      - name: Rotulos de pino do conector x busdef.py
        run: python tools/confere_pinos.py

      - name: Nenhum contato que difere entre TK e ZX Spectrum
        run: python tools/confere_compatibilidade.py

      - name: Texto sobreposto na vista de lado
        run: python tools/confere_svg.py

      - name: Saidas de producao correspondem as placas
        run: python tools/confere_saidas.py

  alinhamento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versao fixada na mesma que gera as placas na bancada. As placas estao
      # no formato do KiCad 10 (`version 20260206`) e nao abrem em 8 nem 9.
      #
      # `docker run` em vez de `container:` de proposito: assim o checkout
      # roda no host, como usuario normal, e so a conferencia entra no
      # container. Com `container:` a imagem do KiCad, que nao roda como root,
      # complica a permissao do workspace.
      - name: Alinhamento entre a placa principal e a tira
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            kicad/kicad:10.0.4 \
            python3 tools/confere_alinhamento.py
