<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560"
     font-family="DejaVu Sans, Verdana, sans-serif" font-size="13">
  <title>TKMEM-128 — vista de lado, com a caixa em corte</title>
  <desc>A placa principal fica em pe dentro da caixa, vista aqui de perfil. O
  conector de borda vai na aresta de baixo, com o corpo virado para o micro; os
  terminais atravessam a placa e a tira de expansao e soldada neles, entre as
  duas fileiras, saindo pela traseira. O cartao do micro, a fenda do conector e a
  tira ficam todos no mesmo plano horizontal.</desc>

  <rect width="860" height="560" fill="#fbfbfa"/>

  <defs>
    <marker id="seta" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#333"/>
    </marker>
    <pattern id="ouro" width="6" height="6" patternTransform="rotate(45)"
             patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#2a6b3f"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d8b26a" stroke-width="3"/>
    </pattern>
  </defs>

  <!-- ===================== titulo ======================================== -->
  <text x="24" y="30" font-size="16" font-weight="bold" fill="#111">
    Vista de lado, com a caixa em corte</text>
  <text x="24" y="52" fill="#555">
    A placa principal está <tspan font-style="italic">de perfil</tspan>: você vê
    a espessura dela, não a face.</text>

  <!-- ===================== orientacao ==================================== -->
  <text x="215" y="88" fill="#888" font-size="12">← frente</text>
  <text x="645" y="88" fill="#888" font-size="12" text-anchor="end">traseira →</text>

  <!-- ===================== plano comum (atras de tudo) =================== -->
  <line x1="30" y1="211" x2="836" y2="211" stroke="#0a7d55" stroke-width="1"
        stroke-dasharray="8 6"/>

  <!-- ===================== caixa em corte ================================ -->
  <path d="M210 96 L650 96 L650 186 M650 236 L650 326 L210 326 L210 236
           M210 186 L210 96"
        fill="none" stroke="#9a9a9a" stroke-width="3.5" stroke-linejoin="round"/>
  <text x="222" y="116" fill="#888" font-size="12">caixa Patola PB 085/3, em corte</text>
  <text x="196" y="215" fill="#9a9a9a" font-size="11" text-anchor="end">fenda</text>
  <text x="664" y="215" fill="#9a9a9a" font-size="11">fenda</text>

  <!-- ===================== placa principal, de perfil ==================== -->
  <rect x="398" y="108" width="10" height="206" fill="#2a6b3f"/>
  <text x="422" y="126" fill="#111" font-size="12">componentes deste lado</text>
  <line x1="414" y1="136" x2="492" y2="136" stroke="#333" stroke-width="1.4"
        marker-end="url(#seta)"/>
  <text x="422" y="166" fill="#111" font-weight="bold">placa principal</text>
  <text x="422" y="184" fill="#555" font-size="12">em pé, 4 camadas</text>
  <text x="422" y="200" fill="#555" font-size="12">78,74 × 66,04 mm</text>

  <!-- ===================== conector de borda ============================= -->
  <rect x="330" y="182" width="68" height="58" rx="3" fill="#3f3f3f"/>
  <rect x="330" y="206" width="30" height="10" fill="#fbfbfa"/>
  <text x="364" y="258" fill="#111" font-size="12" text-anchor="middle">J1</text>

  <!-- terminais retos atravessando a placa -->
  <line x1="384" y1="203" x2="470" y2="203" stroke="#b0b0b0" stroke-width="2.8"/>
  <line x1="384" y1="219" x2="470" y2="219" stroke="#b0b0b0" stroke-width="2.8"/>

  <!-- ===================== cartao do micro =============================== -->
  <rect x="34" y="206" width="296" height="10" fill="#2a6b3f"/>
  <rect x="284" y="206" width="46" height="10" fill="url(#ouro)"/>

  <!-- ===================== tira de expansao ============================== -->
  <rect x="408" y="207" width="418" height="8" fill="#2a6b3f"/>
  <rect x="770" y="207" width="56" height="8" fill="url(#ouro)"/>

  <!-- ===================== rotulos, na banda de baixo ==================== -->
  <line x1="120" y1="216" x2="120" y2="352" stroke="#bbb" stroke-width="1"/>
  <text x="120" y="370" fill="#111" font-weight="bold" text-anchor="middle">cartão do micro</text>
  <text x="120" y="388" fill="#555" font-size="12" text-anchor="middle">TK90X / TK95 ou</text>
  <text x="120" y="404" fill="#555" font-size="12" text-anchor="middle">ZX Spectrum 48K</text>

  <line x1="364" y1="266" x2="364" y2="352" stroke="#bbb" stroke-width="1"/>
  <text x="364" y="370" fill="#111" font-weight="bold" text-anchor="middle">conector de borda</text>
  <text x="364" y="388" fill="#555" font-size="12" text-anchor="middle">entrada vertical — o corpo</text>
  <text x="364" y="404" fill="#555" font-size="12" text-anchor="middle">fica virado para o micro, e é</text>
  <text x="364" y="420" fill="#555" font-size="12" text-anchor="middle">o único componente daquele lado</text>

  <line x1="660" y1="216" x2="660" y2="352" stroke="#bbb" stroke-width="1"/>
  <text x="660" y="370" fill="#111" font-weight="bold" text-anchor="middle">tira de expansão</text>
  <text x="660" y="388" fill="#555" font-size="12" text-anchor="middle">78,74 × 45 mm, 2 camadas</text>
  <text x="660" y="404" fill="#555" font-size="12" text-anchor="middle">sai pela traseira e leva o</text>
  <text x="660" y="420" fill="#555" font-size="12" text-anchor="middle">barramento ao periférico seguinte</text>

  <!-- ===================== detalhe do encaixe da tira ==================== -->
  <rect x="470" y="452" width="250" height="46" rx="4" fill="#fff" stroke="#0a7d55"/>
  <line x1="486" y1="464" x2="704" y2="464" stroke="#b0b0b0" stroke-width="3.4"/>
  <rect x="486" y="471" width="218" height="8" fill="#2a6b3f"/>
  <line x1="486" y1="486" x2="704" y2="486" stroke="#b0b0b0" stroke-width="3.4"/>
  <text x="732" y="461" fill="#0a7d55" font-size="11">terminal de cima</text>
  <text x="732" y="477" fill="#0a7d55" font-size="11">a tira, entre eles</text>
  <text x="732" y="493" fill="#0a7d55" font-size="11">terminal de baixo</text>
  <text x="24" y="464" fill="#111" font-size="12" font-weight="bold">Como a tira encaixa</text>
  <text x="24" y="482" fill="#555" font-size="12">os terminais são retos: a tira entra</text>
  <text x="24" y="498" fill="#555" font-size="12">entre as duas fileiras e é soldada</text>
  <text x="24" y="514" fill="#555" font-size="12">pelos dois lados.</text>

  <!-- ===================== degrau zero =================================== -->
  <text x="24" y="540" fill="#0a7d55" font-size="12" font-weight="bold">Degrau zero:</text>
  <text x="118" y="540" fill="#555" font-size="12">o cartão do micro, a fenda do conector e a
    tira ficam todos na mesma linha — a tracejada que atravessa o desenho.</text>
</svg>
