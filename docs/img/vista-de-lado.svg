<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600"
     font-family="DejaVu Sans, Verdana, sans-serif" font-size="13">
  <title>TKMEM-128 — vista de lado, com a caixa em corte</title>
  <desc>A placa principal fica em pe dentro da caixa Patola, rente ao fundo dela.
  O conector de borda e soldado na placa e SAI da caixa pela frente, porque o slot
  de expansao do micro e recuado dentro da carcaça: a caixa encosta na traseira do
  micro e so o conector entra. Os terminais do conector atravessam a placa e a
  tira de expansao e soldada neles, entre as duas fileiras, saindo pela traseira.
  Cartao, fenda do conector e tira ficam todos no mesmo plano horizontal.</desc>

  <rect width="880" height="600" fill="#fbfbfa"/>

  <defs>
    <marker id="seta" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#333"/>
    </marker>
    <pattern id="ouro" width="6" height="6" patternTransform="rotate(45)"
             patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#2a6b3f"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d8b26a" stroke-width="3"/>
    </pattern>
    <!-- marca de interrupcao: diz que a peca continua para cima -->
    <g id="quebra">
      <line x1="-9" y1="6" x2="9" y2="-6" stroke="#9a9a9a" stroke-width="2.5"/>
      <line x1="-9" y1="16" x2="9" y2="4" stroke="#9a9a9a" stroke-width="2.5"/>
    </g>
  </defs>

  <!-- ===================== titulo ======================================== -->
  <text x="24" y="30" font-size="16" font-weight="bold" fill="#111">
    Vista de lado, com as caixas em corte</text>
  <text x="24" y="52" fill="#555">
    A placa principal está <tspan font-style="italic">de perfil</tspan>: você vê
    a espessura dela, não a face.</text>

  <!-- ===================== plano comum (atras de tudo) =================== -->
  <line x1="30" y1="250" x2="856" y2="250" stroke="#0a7d55" stroke-width="1"
        stroke-dasharray="8 6"/>

  <!-- ===================== carcaca do micro ============================== -->
  <!-- so a parte de tras; a abertura EXPANSION deixa o conector entrar -->
  <path d="M40 160 L300 160 L300 232 M300 272 L300 344 L40 344"
        fill="none" stroke="#7a7a7a" stroke-width="3.5" stroke-linejoin="round"/>
  <use href="#quebra" x="40" y="150"/>
  <text x="52" y="182" fill="#777" font-size="12">carcaça do micro, em corte</text>

  <!-- ===================== cartao do micro (recuado) ===================== -->
  <rect x="56" y="245" width="226" height="10" fill="#2a6b3f"/>
  <rect x="236" y="245" width="46" height="10" fill="url(#ouro)"/>
  <line x1="282" y1="245" x2="282" y2="200" stroke="#bbb" stroke-width="1"/>
  <line x1="300" y1="245" x2="300" y2="200" stroke="#bbb" stroke-width="1"/>
  <line x1="282" y1="204" x2="300" y2="204" stroke="#333" stroke-width="1"/>
  <text x="266" y="208" fill="#111" font-size="11" text-anchor="end">recuo do slot</text>

  <!-- ===================== conector de borda ============================= -->
  <!-- sai da caixa Patola e entra na abertura do micro -->
  <rect x="248" y="220" width="102" height="62" rx="3" fill="#3f3f3f"/>
  <rect x="248" y="244" width="40" height="12" fill="#fbfbfa"/>
  <text x="340" y="233" fill="#fff" font-size="12" text-anchor="middle">J1</text>

  <!-- terminais retos atravessando a placa -->
  <line x1="338" y1="240" x2="428" y2="240" stroke="#b0b0b0" stroke-width="2.8"/>
  <line x1="338" y1="260" x2="428" y2="260" stroke="#b0b0b0" stroke-width="2.8"/>

  <!-- ===================== caixa Patola ================================== -->
  <!-- parede da frente: desce so ate acima do conector. O recorte por onde o
       conector passa e justamente o que a documentacao manda abrir na caixa. -->
  <path d="M330 160 L330 214" fill="none" stroke="#9a9a9a" stroke-width="3.5"/>
  <path d="M330 344 L700 344 L700 272 M700 232 L700 160"
        fill="none" stroke="#9a9a9a" stroke-width="3.5" stroke-linejoin="round"/>
  <use href="#quebra" x="330" y="150"/>
  <use href="#quebra" x="700" y="150"/>
  <text x="446" y="312" fill="#777" font-size="12">caixa Patola PB 085/3, em corte</text>
  <text x="446" y="328" fill="#777" font-size="11">— as paredes continuam para cima</text>
  <!-- acima da tira: abaixo dela passa o coto do rotulo da tira, em x=760 -->
  <text x="712" y="216" fill="#777" font-size="11">fenda da</text>
  <text x="712" y="230" fill="#777" font-size="11">traseira</text>

  <!-- ===================== placa principal, de perfil ==================== -->
  <!-- rente ao fundo da caixa, como na interface real -->
  <rect x="350" y="176" width="10" height="160" fill="#2a6b3f"/>
  <!-- O rotulo sobe para ACIMA da caixa e recua para junto da placa, com coto
       ate ela. Solto a meia altura, ele pousava sobre a tira e parecia nomear a
       tira, nao a placa. -->
  <text x="376" y="104" fill="#111" font-weight="bold">placa principal</text>
  <text x="376" y="122" fill="#555" font-size="12">em pé, 4 camadas, 78,74 × 66,04 mm</text>
  <line x1="380" y1="130" x2="357" y2="172" stroke="#bbb" stroke-width="1"/>

  <text x="368" y="202" fill="#111" font-size="12">componentes deste lado</text>
  <line x1="366" y1="214" x2="444" y2="214" stroke="#333" stroke-width="1.4"
        marker-end="url(#seta)"/>

  <!-- ===================== tira de expansao ============================== -->
  <rect x="360" y="246" width="486" height="8" fill="#2a6b3f"/>
  <rect x="790" y="246" width="56" height="8" fill="url(#ouro)"/>

  <!-- ===================== rotulos, banda de baixo ======================= -->
  <line x1="150" y1="256" x2="150" y2="386" stroke="#bbb" stroke-width="1"/>
  <text x="150" y="404" fill="#111" font-weight="bold" text-anchor="middle">cartão do micro</text>
  <text x="150" y="422" fill="#555" font-size="12" text-anchor="middle">a abertura EXPANSION é recuada</text>
  <text x="150" y="438" fill="#555" font-size="12" text-anchor="middle">dentro da carcaça — é por isso que</text>
  <text x="150" y="454" fill="#555" font-size="12" text-anchor="middle">o conector tem que sair da caixa</text>

  <line x1="299" y1="284" x2="299" y2="386" stroke="#bbb" stroke-width="1"/>
  <text x="400" y="404" fill="#111" font-weight="bold" text-anchor="middle">conector de borda</text>
  <text x="400" y="422" fill="#555" font-size="12" text-anchor="middle">entrada vertical — fica FORA da caixa</text>
  <text x="400" y="438" fill="#555" font-size="12" text-anchor="middle">Patola, atravessando o recorte que</text>
  <text x="400" y="454" fill="#555" font-size="12" text-anchor="middle">se abre na frente dela</text>

  <!-- x=760 e nao 700: em 700 esta a parede de tras da caixa, e o coto parecia
       apontar para a caixa em vez de para a tira -->
  <line x1="760" y1="256" x2="760" y2="386" stroke="#bbb" stroke-width="1"/>
  <text x="700" y="404" fill="#111" font-weight="bold" text-anchor="middle">tira de expansão</text>
  <text x="700" y="422" fill="#555" font-size="12" text-anchor="middle">78,74 × 45 mm, 2 camadas</text>
  <text x="700" y="438" fill="#555" font-size="12" text-anchor="middle">sai pela traseira e leva o barramento</text>
  <text x="700" y="454" fill="#555" font-size="12" text-anchor="middle">ao periférico seguinte</text>

  <!-- ===================== detalhe do encaixe da tira ==================== -->
  <rect x="470" y="490" width="250" height="46" rx="4" fill="#fff" stroke="#0a7d55"/>
  <line x1="486" y1="502" x2="704" y2="502" stroke="#b0b0b0" stroke-width="3.4"/>
  <rect x="486" y="509" width="218" height="8" fill="#2a6b3f"/>
  <line x1="486" y1="524" x2="704" y2="524" stroke="#b0b0b0" stroke-width="3.4"/>
  <text x="732" y="499" fill="#0a7d55" font-size="11">terminal de cima</text>
  <text x="732" y="515" fill="#0a7d55" font-size="11">a tira, entre eles</text>
  <text x="732" y="531" fill="#0a7d55" font-size="11">terminal de baixo</text>
  <text x="24" y="502" fill="#111" font-size="12" font-weight="bold">Como a tira encaixa</text>
  <text x="24" y="520" fill="#555" font-size="12">os terminais são retos: a tira entra</text>
  <text x="24" y="536" fill="#555" font-size="12">entre as duas fileiras e é soldada</text>
  <text x="24" y="552" fill="#555" font-size="12">pelos dois lados.</text>

  <!-- ===================== degrau zero =================================== -->
  <text x="24" y="580" fill="#0a7d55" font-size="12" font-weight="bold">Degrau zero:</text>
  <text x="118" y="580" fill="#555" font-size="12">cartão, fenda do conector e tira ficam todos na linha tracejada.</text>
</svg>
